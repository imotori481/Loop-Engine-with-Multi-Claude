<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loop Engine</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main>
    <header><p class="eyebrow">OPERATOR CONSOLE</p><h1>Loop Engine</h1><p id="project"></p></header>
    <section class="summary">
      <article><span>状態</span><strong id="phase">読み込み中</strong></article>
      <article><span>Green</span><strong id="progress">—</strong></article>
      <article><span>最終イベント</span><strong id="last-event">—</strong></article>
      <article><span>接続元</span><strong id="scope">—</strong></article>
    </section>
    <section><div class="section-title"><h2>いまの作業</h2><span id="live-updated"></span></div><article id="live" class="live"><p class="why">読み込み中</p></article></section>
    <section><div class="section-title"><h2>クリティックの指摘</h2><span id="critique-at"></span></div><article id="critique"><p class="why">読み込み中</p></article></section>
    <section><h2>ステップ</h2><div class="table-wrap"><table><thead><tr><th>ID</th><th>状態</th><th>内容</th></tr></thead><tbody id="steps"></tbody></table></div></section>
    <section><div class="section-title"><h2>人間の対応待ち</h2><button id="refresh">更新</button></div><div id="pending" class="stack"></div></section>
    <section id="pull-request-section" hidden><h2>プルリクエスト</h2><article id="pull-request" class="live"></article></section>
    <section><h2>成果物</h2><div id="launchers" class="actions"></div></section>
    <section><div class="section-title"><h2>役割ごとの消費</h2><div class="controls"><div id="token-legend" class="legend"></div><div id="role-metric" class="toggle"><button data-value="tokens" aria-pressed="true">トークン</button><button data-value="usd" aria-pressed="false">USD</button></div></div></div><article class="chart"><div id="token-chart" class="plot"></div><details><summary>表で見る</summary><div class="table-wrap"><table><thead><tr><th>回</th><th>写し</th><th>開始</th><th>結果</th><th>プランナー</th><th>クリティック</th><th>ソルバー</th></tr></thead><tbody id="token-table"></tbody></table></div></details></article></section>
    <section><div class="section-title"><h2>トークンの種類ごとの消費</h2><div class="controls"><div id="kind-legend" class="legend blocks"></div><div id="kind-role" class="toggle"><button data-value="all" aria-pressed="true">全体</button><button data-value="planner" aria-pressed="false">プランナー</button><button data-value="critic" aria-pressed="false">クリティック</button><button data-value="solver" aria-pressed="false">ソルバー</button></div></div></div><article class="chart"><div id="kind-chart" class="plot"></div><details><summary>表で見る</summary><div class="table-wrap"><table><thead><tr><th>回</th><th>写し</th><th>開始</th><th>キャッシュ読み取り</th><th>キャッシュ書き込み</th><th>入力</th><th>出力</th></tr></thead><tbody id="kind-table"></tbody></table></div></details></article></section>
    <section><h2>最近の台帳</h2><div class="table-wrap"><table><thead><tr><th>時刻</th><th>イベント</th><th>ステップ</th></tr></thead><tbody id="events"></tbody></table></div></section>
  </main>
  <template id="request-template"><article class="request"><div><span class="badge"></span><h3></h3></div><pre></pre><textarea maxlength="4000" placeholder="確認結果やプランナーへの回答を記録"></textarea><div class="request-actions"></div></article></template>
  <script src="/app.js"></script>
</body>
</html>
